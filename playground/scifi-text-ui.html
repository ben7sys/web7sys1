<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sci-Fi Vision Text</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            margin: 0;
            background: radial-gradient(circle at 50% 50%, #1e1e2f, #131324);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 3rem;
            color: #00fff0;
            text-shadow: 0px 0px 20px rgba(0, 255, 240, 0.8);
            animation: fadeInUp 2s ease-out;
        }
        .tagline {
            font-size: 1.5rem;
            margin-top: 10px;
            color: #b8d8f8;
            animation: fadeInUp 3s ease-out;
        }
        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(50px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            .tagline {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>automated systems</h1>
        <div class="tagline">to improve the world and beyond</div>
    </div>
</body>
</html>
